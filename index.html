<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipping Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <div class="container">
        <div class="card front-face">
            <header>
                <span class="logo">
                    <img src="./images/mastercard-26161.png" alt="logo">
                    <h5>Mastercard</h5>
                </span>
                <img src="./images/—Pngtree—close-up view of a golden_23691834.png" alt="card-chip" class="chip">
            </header>

            <div class="card-details">
                <div class="name-number">
                    <h6>Card Number</h6>
                    <h5 class="number">5163 9685 4526 1258</h5>
                    <h5 class="name">Michael B. Anderson</h5>
                </div>

                <div class="valid-date">
                    <h6>Valid Thru</h6>
                    <h5>08/30</h5>
                </div>
            </div>
        </div>

        <div class="card rear-face">
            <h6>For customer service call +1 958 555 4498</h6>
            <span class="magnetic-strip"></span>
            <div class="signature"><i>005</i></div>
            <h5>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempore distinctio, officiis ratione nam odio illu.</h5>
        </div>
      </div>
    </section>
  </body>
</html>
